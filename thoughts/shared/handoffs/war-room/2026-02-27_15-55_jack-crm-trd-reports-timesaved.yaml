decisions:
  - data_backed_time_saved: Analyzed 136 real Jack replies. Per-reply: 7.0 min without CRM → 1.2 min with CRM = 5.8 min saved. Monthly (25 active threads): 10.2 hrs / $2,551.
  - template_drafts_for_mvp: MVP uses template-based draft replies, not live LLM. Haiku integration deferred to V1.0 (~$0.25/mo cost).
  - persistent_profile_primary: Auth hierarchy — persistent browser profile (userDataDir) > password (Keychain) > OTP/IMAP > manual + alert.
  - mac_mini_solves_two_tigers: Always-on Mac Mini resolves both launchd+headed browser conflict and single-machine dependency.
  - selector_validation_gate: Post-scrape check — if members < 200, don't overwrite good data, alert Makima.

findings:
  - context_burden_grows_with_thread: Early replies (comment 1-19) = 0.9 min re-reading. Late replies (50+) = 8.6 min. 58/136 of Jack's replies are deep in threads.
  - seventy_nine_pct_lab_refs: 79% of Jack's replies reference specific lab markers — high context dependency, CRM's core value.
  - twenty_six_pct_truncated: 26% of replies were cut off by Skool "See more" — real reply lengths understated, time saved estimates are conservative.
  - launchd_headed_conflict: launchd background jobs don't get WindowServer access on macOS — can't run headed Playwright. Mac Mini with logged-in GUI session solves this.
  - tooltip_overflow_fix: white-space:nowrap breaks long tooltips. Changed to white-space:normal + width:max-content + max-width:320px.

worked:
  - Canvas-based charts with no dependencies — drawLineChart() function handles DPR scaling, grid, fill, range bands
  - Data analysis via inline Node script (cat << 'SCRIPT' | node --input-type=module) — fast, no temp files
  - Premortem caught real architectural conflict (launchd + headed browser) that TRD missed
  - Speaking points doc separate from tooltip text — tooltips stay concise, doc has full methodology

failed:
  - Initial time saved numbers were gut estimates, not data-backed — user correctly pushed for real analysis
  - Tooltip CSS with inline width + left offsets — fought with base CSS transform:translateX(-50%). Removed inline overrides, let base CSS center.


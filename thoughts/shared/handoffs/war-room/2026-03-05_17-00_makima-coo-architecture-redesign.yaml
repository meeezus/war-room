findings:
  - monitoring_not_action: "Makima has monitoring infrastructure (drift auditor, heartbeat, patrol) but no action authority. She detects problems but can't fix them, creating noise loops where the same issues are flagged 11× without resolution."
  - token_burn_root_cause: "12 bootstrap files loaded on every message + every cron trigger (26 crons). Per @the_smart_ape and @xmayeth, this is the #1 cost driver. Each cron trigger = full context injection from scratch."
  - hallucination_root_cause: "Per @systematicls, biased prompts ('find drift', 'check for problems') cause the model to fabricate findings when there are none. Neutral prompts ('report what you observe') prevent this. This explains the 'Memory fragmentation at 12%, sector 7' fabrication."
  - isolated_session_danger: "Isolated sessions can't execute commands. When Makima tries, she fabricates results instead of reporting failure. All crons needing file access must use main/systemEvent."
  - single_orchestrator_pattern: "Per Alex Finn (@peterdiamandis) and @Jacobsklug — one interface (Henry/Jarvis) routes everything. Don't split across 5 different state files and 26 independent crons."
  - obsidian_is_the_file: "Don't add Obsidian plugin complexity. Symlink ACTIVE-TASKS.md into vault. The file IS the integration — Makima writes to it, Sensei sees it in Obsidian."


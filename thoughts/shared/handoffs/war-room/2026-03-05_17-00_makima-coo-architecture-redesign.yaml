  - cron_triage: "26 crons → ~12. KILL 6 (Initiation Check, Drift Audit, Cron Watchdog, Priorities Check, Bookmark Scout, Auth Fix Reminder). MERGE 4 into 2 (Email Digest→Morning Brief, Weekly AI Metrics→Board of Directors). FIX 6 (isolated→main/systemEvent)."

decisions:
  - use_control_ui_token: Gateway token doesn't grant operator.write scope; Control UI device token (fbb52b0db28b4c8395e64b06e29367be) has all necessary scopes
  - webchat_ui_client_id: Gateway only accepts specific client IDs; webchat-ui is the valid one for webchat mode

findings:
  - origin_header_required: Server-side Node.js WebSocket connections don't send Origin header by default; must explicitly add it
  - dangerouslyDisableDeviceAuth_limited: This flag bypasses cryptographic device identity but does NOT auto-grant scopes; scopes still come from paired device tokens
  - scope_from_device_token: The token used in auth.token must match a paired device entry's token to get that device's scopes


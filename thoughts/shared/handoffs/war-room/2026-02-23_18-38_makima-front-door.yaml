questions:
  - Does OpenClaw gateway need any config changes to accept Shoin Chat as a client?
  - Should council prompt use OpenClaw (real Makima) instead of claude --print for voice generation?

decisions:
  - openclaw_per_request: New WS connection per request (simple, no stale state). Optimize to pool later if needed.
  - session_skip_makima: Makima threads skip all Claude CLI session management. OpenClaw manages its own sessions.
  - fallback_fresh_uuid: Fallback from OpenClaw always uses fresh randomUUID(), never reuses thread session IDs.
  - missions_schema_match: Agent correctly dropped priority/metadata columns (not in DB), added proposal_id instead.
  - council_type_autodetect: POST /api/chat/council auto-detects council type from keyword scoring (security/technical/business/full).

findings:
  - gateway_protocol: OpenClaw uses JSON-RPC over WS. Connect with method "connect" (protocol v3, token auth), send with "chat.send" (sessionKey "main", idempotencyKey), receive "chat" events with state delta/done/error.
  - gateway_token: 5734cf2c1b6111a538e0dccde938cb1157b8956eefd3c396 (from ~/.openclaw/clawdbot.json → gateway.auth)
  - session_collision_bug: First message to Makima created a Claude CLI session ID but never used it. Second message found it, set isResume=true. If OpenClaw failed, fallback tried resume with unused session → "Session ID already in use" error.
  - branch_base: Branched from main but chat UI lives on feature/agent-aware-chat. Had to rebase onto agent-aware-chat then reapply agent-created files.


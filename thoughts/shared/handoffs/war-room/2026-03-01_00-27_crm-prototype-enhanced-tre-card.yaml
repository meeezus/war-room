decisions:
  - chat_at_top: "Moved chat bar from bottom of card to top — primary interaction, not afterthought"
  - chips_built_in_js: "Smart pills built via JS after innerHTML (not inline template literals) to avoid quote escaping hell"
  - draft_reply_priority: "Draft/reply handler must come BEFORE latest/recent handler in if/else chain — 'Draft reply to latest' contains 'latest' keyword"
  - conditional_tabs: "Only show Thread tab if m.threads exists, Nutrition if m.cronometer exists. Stack/Labs go in Overview, not own tabs"
  - no_sidebar: "User rejected left sidebar — wants mobile-first layout (profile bar at top, full-width tabs) for desktop too"
  - default_member_data: "Most members only have: name, join date, last active, level, points, post counts, activity heatmap, status. Stack/labs/threads/cronometer are Tre-specific enrichment"

findings:
  - keyword_collision: "In chat handler if/else chain, keyword order matters. 'Draft reply to latest comment' matches 'latest' before 'draft'. Always put more specific handlers first."
  - quote_escaping_hell: "Template literals with ternary + string concat + onclick handlers = broken escaping. Build DOM elements in JS after innerHTML instead."
  - jack_vision: "Jack wants per-member AI knowledge base (like ChatGPT Projects). Browse thread first, then ask AI. Scoped to one thread per member, not all posts. Already built for Tre."
  - tabs_vs_cards: "Jack said 'tabs per person' but at 224 members that's unusable. Card/page-based flow (search → click → detail) is correct UX."


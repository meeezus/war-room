decisions:
  - tenshu_is_pure_ops: "War Room / Tenshu = reflexive agentic automation ops dashboard ONLY. Not for human-directed iterative work. Objectives, council, daimyo characters, chat — all belong to a different product."
  - strip_from_tenshu: "Remove: Objectives, Council, Morning Brief, Daimyo sidebar with personalities, Chat, action bars for human-directed work (New Objective, Council review)"
  - keep_in_tenshu: "Keep: Active Sessions, Agents Online, Tasks Running, Errors, System Health, Event feed, Waterfall on mission detail"
  - model_after_mission_control: "Adopt Mission Control (builderz-labs) layout patterns — clean stat cards, key-value panels, organized sidebar by verb, persistent event rail, bottom action bar"
  - shoin_stays_in_repo: "Don't separate Shoin Chat into own repo yet. It's just a route. Split when products diverge significantly."
  - custom_ide_is_rabbit_hole: "Building a full IDE (Cursor/Windsurf competitor) is a rabbit hole. The Daimyo character stuff could be a web companion app or VS Code extension instead."
  - daimyo_characters_future_home: "The Daimyo names, council reviews, approval gates, interactive sessions — all belong in a future creative workspace / IDE companion. Park for now."

findings:
  - mission_control_reference: "github.com/builderz-labs/mission-control — clean ops dashboard for agentic systems. Screenshot at docs/mission-control.jpg. Key patterns: 4 top-level stat cards, key-value health panels, sidebar nav grouped by verb, bottom action bar, persistent event rail."
  - agent_prism_reference: "github.com/evilmartians/agent-prism — React components for visualizing AI agent execution traces. Could enhance waterfall later with OpenTelemetry span format."
  - conflation_lesson: "Sensei had conflated two products — (1) autonomous agent ops dashboard and (2) human-directed creative workspace with agent assistance. Objectives were created for human thinking goals, not automation targets. This explains why approving agent work felt 'fake'."
  - waterfall_works_with_existing_data: "No new data needed for waterfall — tasks already have started_at, completed_at, status, kind, model. Just needed visualization."

